name: eden_platform_flutter_example
description: Example app for the Eden platform Flutter shell.
publish_to: none

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # Used by example/aoid_quickstart/main.dart: Mode A needs an http.Client for
  # both AoidNativeClient and HttpBffCodeSink, neither of which constructs its
  # own transport (the consumer must be able to pass BrowserClient with
  # withCredentials on a cross-origin BFF).
  http: ^1.2.0
  # STAGE A of AOID objective 50's riverpod alignment (TRD 50-06). This must
  # track the parent package's constraint: `example` depends on
  # eden_platform_flutter by path, so a 2.x pin here makes `flutter pub get`
  # fail for the whole repo. See ../doc/riverpod-3-migration.md.
  flutter_riverpod: ^3.0.0
  eden_platform_flutter:
    path: ..
  eden_ui_flutter:
    path: ../../eden-ui-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Keep monorepo dev working — when running this example inside eden-libs,
# redirect transitive deps to local paths.
dependency_overrides:
  eden_ui_flutter:
    path: ../../eden-ui-flutter
  eden_platform_api_dart:
    path: ../../eden-platform-api-dart

flutter:
  uses-material-design: true
