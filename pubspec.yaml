name: eden_platform_flutter
description: "Shared auth, navigation, and platform shell for all Eden apps."
version: 0.1.0
homepage:
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  connectrpc: ^1.0.0
  flutter_riverpod: ^2.6.1
  http: ^1.2.0
  shared_preferences: ^2.3.0
  # CLI-01: encrypted token persistence (Keychain/EncryptedSharedPreferences).
  # Pinned to 9.2.4 — DO NOT bump to 10.x (upstream issue #1043 data-loss bug).
  # See eden-biz-flutter.SAAS/.planning/objectives/10-client-security-baseline/10-RESEARCH.md Pitfall 1.
  flutter_secure_storage: 9.2.4
  # Use git: with path: so external consumers can fetch this package
  # standalone via `eden_platform_flutter: { git: { url, ref } }`. Inside
  # the eden-libs monorepo, dependency_overrides in the consuming project
  # can redirect this to the local path during dev.
  eden_platform_api_dart:
    git:
      url: https://github.com/AO-Cyber-Systems/eden-libs.git
      path: eden-platform-api-dart
      ref: main
  go_router: ^14.0.0
  eden_ui_flutter:
    git:
      url: https://github.com/AO-Cyber-Systems/eden-ui-flutter.git
      ref: c50bc165e136f528ee3874e434da671c96018019
  # JWT exp-claim decoding for ProactiveRefresh (upstream from eden-biz).
  dart_jsonwebtoken: ^2.0.0
  # Networking — gold-standard dio_client donated from AODex.
  # See lib/src/networking/README.md.
  dio: ^5.9.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  web_socket_channel: ^3.0.3
  sentry_dio: ^8.14.2
  # SOCIAL-06: cross-platform OAuth browser session (ASWebAuthenticationSession
  # iOS/macOS, Chrome Custom Tab Android, postMessage Web) for consumer social
  # login. Drives SocialAuthService — see lib/src/auth/social_auth_service.dart.
  flutter_web_auth_2: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0

# Dev-only: inside the eden-libs monorepo, redirect eden_platform_api_dart to
# the local sibling checkout so this package builds against in-progress proto
# bindings (e.g. SOCIAL-06's InitiateSocialLogin RPC) before they land on the
# git `main` ref the `dependencies` block pins. External consumers that fetch
# this package via git ignore dependency_overrides, so the published surface is
# unaffected. Remove (or let it no-op) once the api-dart ref bumps.
dependency_overrides:
  eden_platform_api_dart:
    path: ../eden-platform-api-dart

flutter:
  uses-material-design: true
