name: eden_platform_flutter
description: "Shared auth, navigation, and platform shell for all Eden apps."
version: 0.1.0
homepage:
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  connectrpc: ^1.0.0
  # STAGE A of AOID objective 50's riverpod alignment (50-CONTEXT.md D2, TRD 50-06).
  # This is the VERSION axis only: the pin moved 2.6.1 -> 3.x and every
  # StateNotifier site kept compiling via `package:flutter_riverpod/legacy.dart`,
  # which in 3.x still exports StateNotifier/StateController/StateNotifierProvider/
  # StateProvider/ChangeNotifierProvider and the *Family variants.
  #
  # The StateNotifier -> Notifier API rewrites are DELIBERATELY separate work
  # (50-20..50-23), one notifier at a time, so that a break in any of the 18
  # downstream consumer packages is attributable to a single change.
  #
  # See doc/riverpod-3-migration.md for the four-stage plan and the per-notifier
  # inventory with owning TRDs.
  flutter_riverpod: ^3.0.0
  http: ^1.2.0
  # PKCE (RFC 7636) S256 code_challenge hashing for AoidOidcAuthStrategy.
  crypto: ^3.0.0
  shared_preferences: ^2.3.0
  # CLI-01: encrypted token persistence (Keychain/EncryptedSharedPreferences).
  # Pinned to 9.2.4 — DO NOT bump to 10.x (upstream issue #1043 data-loss bug).
  # See eden-biz-flutter.SAAS/.planning/objectives/10-client-security-baseline/10-RESEARCH.md Pitfall 1.
  flutter_secure_storage: 9.2.4
  # eden-platform-api-dart is published as its own standalone GitHub repo
  # (AO-Cyber-Systems/eden-platform-api-dart, public). Referencing it
  # directly avoids forcing consumers to authenticate against the private
  # eden-libs superproject just to fetch the generated Dart clients.
  # Inside the eden-libs monorepo, dependency_overrides in the consuming
  # project can redirect this to the local path during dev.
  # TODO: pin `ref:` to a specific SHA once eden-platform-api-dart's release
  # cadence stabilizes — `main` is fine for now but trades reproducibility.
  eden_platform_api_dart:
    git:
      url: https://github.com/AO-Cyber-Systems/eden-platform-api-dart.git
      ref: main
  go_router: ^14.0.0
  eden_ui_flutter:
    git:
      url: https://github.com/AO-Cyber-Systems/eden-ui-flutter.git
      ref: 603eda879214a890c0ad0e906fabc3c6146a7e2f
  # JWT exp-claim decoding for ProactiveRefresh (upstream from eden-biz).
  dart_jsonwebtoken: ^2.0.0
  # Networking — gold-standard dio_client donated from AODex.
  # See lib/src/networking/README.md.
  dio: ^5.9.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  web_socket_channel: ^3.0.3
  # opsCluster obj-31 TRD 31-08 (TELE-03): bumped 8.14.2 -> 9.x and paired with
  # sentry_flutter for the shared initSentry + PII scrubbers in
  # lib/src/observability/sentry_init.dart.
  #
  # The old ^8.14.2 pin was the ROOT of the fleet's version skew: every 9.x
  # consumer carried a dependency_overrides block to escape it —
  #   aodex          sentry_flutter ^9.25.0  (forced by an Xcode 26 /
  #                  sentry-cocoa incompatibility in 8.x, per its pubspec)
  #   eden-biz, pos, ops-console   ^9.19.0
  #   aocore-admin   ^8.14.2       (the last app still on 8.x)
  # Overrides are invisible coupling; fixing the pin here lets consumers delete
  # theirs. aocore-admin must move to 9.x with this change.
  sentry_dio: ^9.19.0
  sentry_flutter: ^9.19.0
  # SOCIAL-06: cross-platform OAuth browser session (ASWebAuthenticationSession
  # iOS/macOS, Chrome Custom Tab Android, postMessage Web) for consumer social
  # login. Drives SocialAuthService — see lib/src/auth/social_auth_service.dart.
  flutter_web_auth_2: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
